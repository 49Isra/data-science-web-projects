<!DOCTYPE html>
<html lang="en">
<head>
    <title>Student Performance Dashboard</title>
    <link rel="stylesheet" href="../static/dashboard.css">
</head>
<body>

    <div class="container">

        <div class="card">

            <h1>Student Performance Dashboard</h1>

            <p>Enter student details to view performance statistics.</p>

            <div class="summary">
                <div class="summary-card">
                    <h3>Total Students</h3>
                    <p>250</p>
                </div>

                <div class="summary-card">
                    <h3>Average Marks</h3>
                    <p>78%</p>
                </div>

                <div class="summary-card">
                    <h3>Pass Percentage</h3>
                    <p>92%</p>
                </div>
            </div>

            <h2>Student Details</h2>

            <input type="text" placeholder="Student Name">
            <input type="number" placeholder="Math Marks">
            <input type="number" placeholder="Science Marks">
            <input type="number" placeholder="English Marks">

            <button>Check Performance</button>

            <div class="result">
                <h2>Student Result</h2>
                <p>Average Score: --</p>
                <p>Grade: --</p>
                <p>Status: --</p>
            </div>

        </div>

    </div>

</body>
</html>
